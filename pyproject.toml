[project]
name = "stderr-rate-limiter"
version = "0.1.0"
description = "A logging.Handler wrapper that enforces a token-bucket rate limit so noisy error streams do not flood stderr during incidents."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
